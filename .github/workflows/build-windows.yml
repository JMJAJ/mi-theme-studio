name: Build Windows installer

on:
  push:
    branches: [main]
    # Docs-only changes don't need a new installer.
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a build still running for an older one.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests and checks don't need debug info; it makes Windows linking much slower.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # Checks run on their own runner, at the same time as the installer build.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Rust stable is already installed on GitHub's Windows runners.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Fetch bundled scrcpy (pinned, checksum-verified)
        run: npm run fetch:scrcpy
      - name: Type-check and test frontend
        run: |
          npm run typecheck
          npm test
      - name: Test native backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci --prefer-offline --no-audit --no-fund
      # Every build of main must be newer than the last published release, or
      # the in-app updater never sees it. Use package.json's version when it is
      # already ahead; otherwise take the next patch after the latest release.
      - name: Pick release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          current=$(node -p "require('./package.json').version")
          version=$(node -e '
            const [cur, last] = process.argv.slice(1);
            const n = (v) => v.split(".").map(Number);
            const newer = (a, b) => { for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false; };
            if (!last || newer(n(cur), n(last))) console.log(cur);
            else { const [M, m, p] = n(last); console.log(`${M}.${m}.${p + 1}`); }
          ' "$current" "$latest")
          echo "package.json $current, latest release ${latest:-none} -> building $version"
          node scripts/bump-version.mjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build NSIS installer
        # Thin LTO keeps the binary small and fast while building in a fraction
        # of the time fat LTO with one codegen unit took. Local builds use the
        # faster settings in Cargo.toml [profile.release].
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_INCREMENTAL: false
          # Signs the installer so the in-app updater accepts it (public key in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:win:ci
      - uses: actions/upload-artifact@v7
        with:
          name: mi-theme-studio-windows
          path: |
            release/*.exe
            release/*.zip
            release/latest.json
          if-no-files-found: error
          # Already compressed; zipping again only costs time.
          compression-level: 0

  # Publishes only when both the checks and the build passed.
  release:
    needs: [test, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mi-theme-studio-windows
          path: release
      - name: Publish GitHub release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.windows-installer.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; the build is kept as a workflow artifact only."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" release/*.exe release/*.zip release/latest.json \
              --target "$GITHUB_SHA" \
              --title "Mi Theme Studio $tag" \
              --generate-notes \
              --latest
          fi
