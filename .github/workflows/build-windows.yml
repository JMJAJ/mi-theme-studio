name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Fetch bundled scrcpy (pinned, checksum-verified)
        run: npm run fetch:scrcpy
      - name: Type-check and test frontend
        run: |
          npm run typecheck
          npm test
      - name: Test native backend
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build NSIS installer (version from package.json)
        # Published builds get the smallest, fully optimized binary; local builds
        # (Cargo.toml [profile.release]) trade a little size for a much faster build.
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_INCREMENTAL: false
        run: npm run build:win:ci
      - uses: actions/upload-artifact@v7
        with:
          name: mi-theme-studio-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
      - name: Publish GitHub release for this version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; the build is kept as a workflow artifact only."
          else
            gh release create "$tag" release/*.exe release/*.zip               --target "$GITHUB_SHA"               --title "Mi Theme Studio $tag"               --generate-notes               --latest
          fi
