<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="align and alignV">
<title>align and alignV</title>
<rect width="1000" height="480" rx="14" fill="#0f1115"/>
<text x="32" y="44" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#e8eaf0">x / y is an anchor point</text>
<text x="32" y="70" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8a93a6">align picks which side of the text sits on x; alignV picks which edge sits on y. The orange dot is (x, y).</text><rect x="30" y="100" width="300" height="140" rx="10" fill="#171a21"/>
<line x1="180" y1="110" x2="180" y2="230" stroke="#2a2f3a" stroke-dasharray="4 4"/>
<text x="180" y="182" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="600" fill="#fff">21:05</text>
<circle cx="180" cy="150" r="5" fill="#ff6a1a"/>
<text x="180" y="262" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" fill="#e8eaf0">align="left"</text><rect x="350" y="100" width="300" height="140" rx="10" fill="#171a21"/>
<line x1="500" y1="110" x2="500" y2="230" stroke="#2a2f3a" stroke-dasharray="4 4"/>
<text x="500" y="182" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="600" fill="#fff">21:05</text>
<circle cx="500" cy="150" r="5" fill="#ff6a1a"/>
<text x="500" y="262" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" fill="#e8eaf0">align="center"</text><rect x="670" y="100" width="300" height="140" rx="10" fill="#171a21"/>
<line x1="820" y1="110" x2="820" y2="230" stroke="#2a2f3a" stroke-dasharray="4 4"/>
<text x="820" y="182" text-anchor="end" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="600" fill="#fff">21:05</text>
<circle cx="820" cy="150" r="5" fill="#ff6a1a"/>
<text x="820" y="262" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" fill="#e8eaf0">align="right"</text><rect x="30" y="300" width="300" height="130" rx="10" fill="#171a21"/>
<line x1="40" y1="360" x2="320" y2="360" stroke="#2a2f3a" stroke-dasharray="4 4"/>
<rect x="120" y="360" width="120" height="48" fill="none" stroke="#4c5670"/>
<text x="180" y="398" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="600" fill="#fff">Tue</text>
<circle cx="180" cy="360" r="5" fill="#ff6a1a"/>
<text x="180" y="452" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" fill="#e8eaf0">alignV="top"</text><rect x="350" y="300" width="300" height="130" rx="10" fill="#171a21"/>
<line x1="360" y1="360" x2="640" y2="360" stroke="#2a2f3a" stroke-dasharray="4 4"/>
<rect x="440" y="336" width="120" height="48" fill="none" stroke="#4c5670"/>
<text x="500" y="374" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="600" fill="#fff">Tue</text>
<circle cx="500" cy="360" r="5" fill="#ff6a1a"/>
<text x="500" y="452" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" fill="#e8eaf0">alignV="center"</text><rect x="670" y="300" width="300" height="130" rx="10" fill="#171a21"/>
<line x1="680" y1="360" x2="960" y2="360" stroke="#2a2f3a" stroke-dasharray="4 4"/>
<rect x="760" y="312" width="120" height="48" fill="none" stroke="#4c5670"/>
<text x="820" y="350" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="40" font-weight="600" fill="#fff">Tue</text>
<circle cx="820" cy="360" r="5" fill="#ff6a1a"/>
<text x="820" y="452" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="15" fill="#e8eaf0">alignV="bottom"</text>
</svg>
