<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-label="Arc angles">
<title>Arc angles</title>
<rect width="1000" height="370" rx="14" fill="#0f1115"/>
<text x="32" y="44" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#e8eaf0">Arc: startAngle and sweep</text>
<text x="32" y="70" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8a93a6">0° points right (3 o'clock) and angles grow clockwise, so -90 starts at the top. Battery is 82% here.</text><rect x="18" y="96" width="224" height="250" rx="10" fill="#171a21"/>
<circle cx="130" cy="200" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="16"/>
<path d="M 210 200 A 80 80 0 0 1 130 280" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
<circle cx="210" cy="200" r="6" fill="#ff6a1a"/>
<text x="130" y="207" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#fff">90°</text>
<text x="130" y="316" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#e8eaf0">startAngle=&quot;0&quot; sweep=&quot;90&quot;</text>
<text x="130" y="334" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8a93a6">orange dot = start</text><rect x="263" y="96" width="224" height="250" rx="10" fill="#171a21"/>
<circle cx="375" cy="200" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="16"/>
<path d="M 375 120 A 80 80 0 0 1 375 280" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
<circle cx="375" cy="120" r="6" fill="#ff6a1a"/>
<text x="375" y="207" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#fff">180°</text>
<text x="375" y="316" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#e8eaf0">startAngle=&quot;-90&quot; sweep=&quot;180&quot;</text>
<text x="375" y="334" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8a93a6">orange dot = start</text><rect x="508" y="96" width="224" height="250" rx="10" fill="#171a21"/>
<circle cx="620" cy="200" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="16"/>
<path d="M 620 120 A 80 80 0 1 1 547.61 165.94" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
<circle cx="620" cy="120" r="6" fill="#ff6a1a"/>
<text x="620" y="207" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#fff">295.2°</text>
<text x="620" y="316" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#e8eaf0">sweep=&quot;360*#battery_level/100&quot;</text>
<text x="620" y="334" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8a93a6">orange dot = start</text><rect x="753" y="96" width="224" height="250" rx="10" fill="#171a21"/>
<circle cx="865" cy="200" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="16"/>
<path d="M 808.43 256.57 A 80 80 0 1 1 921.57 256.57" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
<circle cx="808.43" cy="256.57" r="6" fill="#ff6a1a"/>
<text x="865" y="207" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#fff">270°</text>
<text x="865" y="316" text-anchor="middle" font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="11.5" fill="#e8eaf0">startAngle=&quot;135&quot; sweep=&quot;270&quot;</text>
<text x="865" y="334" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8a93a6">orange dot = start</text>
</svg>
