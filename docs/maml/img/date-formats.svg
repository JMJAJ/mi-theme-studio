<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1308" viewBox="0 0 1000 1308" role="img" aria-label="Date and time patterns">
<title>Date and time patterns</title>
<rect width="1000" height="1308" rx="14" fill="#0f1115"/>
<text x="32" y="44" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="700" fill="#e8eaf0">Date and time patterns</text>
<text x="32" y="70" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8a93a6">DateTime format, drawn at Tuesday 17 March 2026, 21:05:07</text>
