<rect x="62" y="131" width="89.2" height="28" rx="8" fill="#232b3d" stroke="#34405a"/>
<text x="80" y="151" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff">21:05</text>
