[package]
name = "mi-theme-studio"
version = "0.3.0"
description = "Desktop studio for MIUI/HyperOS theme packages"
authors = ["JMJAJ"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "mi_theme_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
quick-xml = "0.42"
imagesize = "0.15"
percent-encoding = "2"
ureq = "3"
sha1_smol = "1"
png = "0.17"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
