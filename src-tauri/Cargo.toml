[package]
name = "mi-theme-studio"
version = "0.4.7"
description = "Desktop studio for MIUI/HyperOS theme packages"
authors = ["JMJAJ"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "mi_theme_studio_lib"
# Desktop only: the staticlib/cdylib outputs are for mobile targets and each one
# repeated the whole optimized link.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
quick-xml = "0.42"
imagesize = "0.15"
percent-encoding = "2"
ureq = "3"
sha1_smol = "1"
png = "0.17"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"

# Local installer builds favour build time: parallel codegen, no cross-crate LTO and an
# incremental cache, so a rebuild after a version bump takes seconds, not minutes.
# CI release builds turn full optimization back on through CARGO_PROFILE_RELEASE_*
# (see .github/workflows/build-windows.yml).
[profile.release]
codegen-units = 16
lto = false
incremental = true
opt-level = "s"
panic = "unwind"
strip = true
